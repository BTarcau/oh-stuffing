name: CI

# Lightweight validation for the static site. This does NOT deploy —
# GitHub Pages' built-in "pages-build-deployment" still handles publishing.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check app.js syntax
        run: node --check app.js
      - name: Validate referenced assets
        run: node scripts/check-site.mjs
