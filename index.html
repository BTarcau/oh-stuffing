<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0b2e" />
  <title>Oh Stuffing! 🦃 — Scorekeeper for Oh Hell / Oh Pshaw</title>
  <meta name="description" content="A free, playful scorekeeper for the card game Oh Stuffing (a.k.a. Oh Hell / Oh Pshaw / Nomination Whist). Auto bid-and-made scoring, live leaderboard, and round-by-round stats. No signup — runs in your browser." />
  <meta name="keywords" content="Oh Stuffing, Oh Hell, Oh Pshaw, Nomination Whist, card game scorekeeper, score tracker, trick-taking, bid game, scoreboard app" />
  <link rel="canonical" href="https://btarcau.github.io/oh-stuffing/" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <!-- Social / link previews -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Oh Stuffing!" />
  <meta property="og:title" content="Oh Stuffing! — the friendly scorekeeper" />
  <meta property="og:description" content="Free score-tracking for the Oh Hell / Oh Pshaw card game. Bids, tricks, live leaderboard and stats — no signup." />
  <meta property="og:url" content="https://btarcau.github.io/oh-stuffing/" />
  <meta property="og:image" content="https://btarcau.github.io/oh-stuffing/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Oh Stuffing! — the friendly scorekeeper" />
  <meta name="twitter:description" content="Free score-tracking for the Oh Hell / Oh Pshaw card game. No signup — runs in your browser." />
  <meta name="twitter:image" content="https://btarcau.github.io/oh-stuffing/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-tab="entry">
  <div class="bg-orbs" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">🦃</span>
      <div class="brand-text">
        <span class="brand-name">Oh&nbsp;Stuffing!</span>
        <span class="brand-tag">the friendly scorekeeper</span>
      </div>
    </div>
    <div class="top-actions">
      <button id="btn-theme" class="icon-btn" title="Toggle light / dark" aria-label="Toggle light or dark theme">☀️</button>
      <button id="btn-newgame" class="ghost-btn" title="Start over">↺ New game</button>
    </div>
  </header>

  <!-- Mobile tab switcher (hidden on wide screens) -->
  <nav class="tabbar" role="tablist">
    <button class="tab" data-tab-target="entry" role="tab">✏️ <span>Entry</span></button>
    <button class="tab" data-tab-target="board" role="tab">🏆 <span>Scoreboard</span></button>
  </nav>

  <main class="layout">
    <section id="panel-entry" class="panel panel-entry" aria-label="Entry"></section>
    <section id="panel-board" class="panel panel-board" aria-label="Scoreboard"></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
